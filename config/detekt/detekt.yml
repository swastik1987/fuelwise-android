# Builds on detekt's default config (buildUponDefaultConfig = true). Only overrides live here.
build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
    # Hilt constructors list a screen's collaborators; grouping them into holder objects only hides the graph.
    constructorThreshold: 12
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    # Enum-to-resource mappings are one branch per value; screen composables branch on state by design.
    ignoreSimpleWhenEntries: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']
    # A Room DAO is a list of queries, and a ViewModel has one function per user action; splitting either by count
    # would only scatter one screen's logic.
    ignoreAnnotated: ['Dao', 'HiltViewModel']
    # Repository interfaces expose observe/save/delete per entity; screen files hold one screen's composables.
    thresholdInInterfaces: 16
    thresholdInClasses: 16
    thresholdInFiles: 18

naming:
  # Compose files pair a small type (route, UI model) with the composables that use it.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  # Early-return guards ("?: return null") are the house style for missing inputs in the engine.
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/**', '**/core/testing/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
