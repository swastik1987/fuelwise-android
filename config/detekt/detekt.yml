# Builds on detekt's default config (buildUponDefaultConfig = true). Only overrides live here.
build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']
    # A Room DAO is a list of queries; splitting it by count would only scatter one table's SQL.
    ignoreAnnotated: ['Dao']

naming:
  # Compose files pair a small type (route, UI model) with the composables that use it.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  # Early-return guards ("?: return null") are the house style for missing inputs in the engine.
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
