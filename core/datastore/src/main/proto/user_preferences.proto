syntax = "proto3";

option java_package = "app.fuelwise.core.datastore";
option java_multiple_files = true;

// App settings (PRD F-18 and onboarding choices). Included in backups; excluded from sync merges except an
// allow-list (PRD §7). Field numbers are permanent: never reuse or renumber one.
message UserPreferences {
  // Identifies this install on synced rows (CLAUDE.md rule 3). Generated once, never shown.
  string device_id = 1;
  bool onboarding_completed = 2;
  // The vehicle the switcher last selected; empty means "first vehicle".
  string selected_vehicle_id = 3;
  string home_city_id = 4;
  bool weekly_digest = 5;
  bool monthly_recap = 6;
  // Off and hidden in R1: no crash reporting SDK (PRD D7).
  bool crash_reports = 7;
  ThemeMode theme_mode = 8;
  bool hide_amounts = 9;
  FeatureFlags feature_flags = 10;
  // Milestone keys already celebrated (PRD F-17: shown once).
  repeated string shown_milestones = 11;
  // Drive backup (PRD F-14). Restores never overwrite this block: it describes this device's backups.
  BackupSettings backup = 12;
  // Column mappings the user confirmed on import (PRD F-13.2), keyed by the file's normalized header row.
  map<string, string> import_mappings = 13;
  // The user's own UPI ID and name for trip-split "pay me" links (PRD F-07.4, F-18). Empty until typed once.
  string upi_vpa = 14;
  string upi_name = 15;
  // Scanning (PRD F-15) uses field numbers 60–69. The pump/receipt photo is attached to the entry unless turned off.
  bool scan_photo_opt_out = 60;
  // Reports (PRD F-13.3) use field numbers 70–79.
  // Business mileage reimbursement rate in paise per km (PRD F-07.9, F-13.3). 0 means not set yet.
  int64 business_rate_paise_per_km = 70;

  // Settings (PRD F-18). Numbers 30–49 are this feature's range.
  // Display units; storage stays canonical (CLAUDE.md rule 2). Per-vehicle entries override the default.
  UnitPreferences units = 30;
  map<string, UnitPreferences> vehicle_units = 31;
  // Home charging tariff in paise per kWh; 0 = not set (PRD F-02.5).
  int64 home_tariff_paise = 32;
  // Material You colours instead of the brand palette. Off by default (PRD F-18).
  bool dynamic_color = 33;
  // App lock with BiometricPrompt or the device credential. Device-specific: never restored from a backup.
  bool app_lock = 34;
  // Lock again after this long in the background; 0 = as soon as the app leaves the screen.
  int32 app_lock_timeout_minutes = 35;
}

// Zero values are the India defaults: km, L, km/L.
message UnitPreferences {
  DistanceUnitPref distance = 1;
  VolumeUnitPref volume = 2;
  EfficiencyUnitPref efficiency = 3;
}

enum DistanceUnitPref {
  DISTANCE_UNIT_KM = 0;
  DISTANCE_UNIT_MILE = 1;
}

enum VolumeUnitPref {
  VOLUME_UNIT_LITRE = 0;
  VOLUME_UNIT_US_GALLON = 1;
  VOLUME_UNIT_UK_GALLON = 2;
}

enum EfficiencyUnitPref {
  EFFICIENCY_UNIT_DISTANCE_PER_QUANTITY = 0;
  EFFICIENCY_UNIT_QUANTITY_PER_100_DISTANCE = 1;
  EFFICIENCY_UNIT_MPG_US = 2;
  EFFICIENCY_UNIT_MPG_UK = 3;
}

message BackupSettings {
  BackupFrequency frequency = 1;
  bool wifi_only = 2;
  bool charging_only = 3;
  // Passphrase-derived key; the key itself is kept wrapped by the Android Keystore, never here.
  bool encrypted = 4;
  string account_email = 5;
  int64 last_success_at = 6;
  int64 last_size_bytes = 7;
  BackupError last_error = 8;
  int64 last_attempt_at = 9;
}

// Daily is the default (PRD F-14.3), so it is the zero value.
enum BackupFrequency {
  BACKUP_FREQUENCY_DAILY = 0;
  BACKUP_FREQUENCY_AFTER_CHANGES = 1;
  BACKUP_FREQUENCY_WEEKLY = 2;
  BACKUP_FREQUENCY_MANUAL = 3;
}

enum BackupError {
  BACKUP_ERROR_NONE = 0;
  BACKUP_ERROR_SIGN_IN = 1;
  BACKUP_ERROR_OFFLINE = 2;
  BACKUP_ERROR_STORAGE_FULL = 3;
  BACKUP_ERROR_KEY_MISSING = 4;
  BACKUP_ERROR_UNKNOWN = 5;
}

enum ThemeMode {
  THEME_MODE_SYSTEM = 0;
  THEME_MODE_LIGHT = 1;
  THEME_MODE_DARK = 2;
}

// R2/R3 features stay behind these flags until their release (CLAUDE.md).
message FeatureFlags {
  bool automatic_trips = 1;
  bool multi_device_sync = 2;
  bool trip_planner = 3;
}
