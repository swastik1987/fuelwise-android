<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;background:var(--surface);border-top:1px solid var(--line);position:relative">
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:72px;align-items:center">
<sc-for list="{{ left }}" as="t" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ t.color }}"><span style="font:300 24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' {{ t.fill }}">{{ t.icon }}</span><span style="font:{{ t.weight }} 12px/16px Geist">{{ t.label }}</span></div></sc-for>
<div style="display:flex;justify-content:center;align-self:start"><div style="width:64px;height:64px;margin-top:-26px;border-radius:20px;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--bg),0 10px 24px rgba(0,0,0,.14)"><span style="font:300 32px/1 'Material Symbols Rounded'">add</span></div></div>
<sc-for list="{{ right }}" as="t" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ t.color }}"><span style="font:300 24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' {{ t.fill }}">{{ t.icon }}</span><span style="font:{{ t.weight }} 12px/16px Geist">{{ t.label }}</span></div></sc-for>
</div>
<div style="height:20px;display:flex;align-items:center;justify-content:center"><div style="width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.35"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;logbook&quot;,&quot;insights&quot;,&quot;garage&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const mk = (id, icon, label) => ({ icon, label, color: a === id ? 'var(--ink)' : 'var(--ink3)', fill: a === id ? '1' : '0', weight: a === id ? '600' : '500' });
    return { left: [mk('home', 'home', 'Home'), mk('logbook', 'receipt_long', 'Logbook')], right: [mk('insights', 'insights', 'Insights'), mk('garage', 'garage_home', 'Garage')] };
  }
}
</script>
</body>
</html>
