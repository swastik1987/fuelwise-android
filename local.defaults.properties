# Defaults for the Secrets Gradle Plugin. Real values go in local.properties, which is never committed.
# Web OAuth client ID from Google Cloud (setup step L1). "not-configured" makes Drive backup say so.
GOOGLE_WEB_CLIENT_ID=not-configured
# Maps SDK for Android key (setup step L2), restricted to the app id + SHA-1 and to that API. Without a real key
# maps show an empty grid; everything else works.
MAPS_API_KEY=not-configured
